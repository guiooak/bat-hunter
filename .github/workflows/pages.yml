# The style guide moved to https://guiooak.github.io/bat-hunter-style-guide/
# (repo guiooak/bat-hunter-style-guide, which publishes brand/ from here).
# This keeps the old address, https://guiooak.github.io/bat-hunter/, working by
# redirecting it there.
name: Brand manual redirect

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build the redirect
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Bat Hunter style guide</title>
              <link rel="canonical" href="https://guiooak.github.io/bat-hunter-style-guide/" />
              <meta http-equiv="refresh" content="0; url=https://guiooak.github.io/bat-hunter-style-guide/" />
            </head>
            <body>
              <p>The Bat Hunter style guide moved to
                <a href="https://guiooak.github.io/bat-hunter-style-guide/">guiooak.github.io/bat-hunter-style-guide</a>.</p>
            </body>
          </html>
          HTML
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
